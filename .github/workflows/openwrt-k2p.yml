name: Custom OpenWrt Build (Main Branch & Modern Toolchain) - K2P

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (主分支建议填 master)'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-24.04 # 使用现代化的 Ubuntu 24.04 编译环境

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：清理磁盘空间防止爆盘
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 步骤三：安装 OpenWrt 官方主分支推荐的现代编译依赖
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            bc binutils-gold ccache ecj fastjar libbsd-dev libelf-dev liblzma-dev \
            liblzo2-dev libtool mtd-utils meson mold ninja-build pbzip2 pigz \
            pkg-config python3-dev subversion texinfo time u-boot-tools xsltproc xxd zstd
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 步骤四：克隆主分支源码
      - name: Clone Source Code
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b ${{ github.event.inputs.branch }} openwrt

      # 步骤五：更新和安装 Feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤六：加载自定义配置与脚本
      - name: Apply Configuration & Custom Scripts
        run: |
          [ -f .config ] && cp .config openwrt/.config
          [ -f diy.sh ] && chmod +x diy.sh && ./diy.sh openwrt

      # 步骤七：生成默认配置并下载依赖（同时启用现代构建选项）
      - name: Download Package Dependencies & Configure
        run: |
          cd openwrt
          make defconfig
          # 针对主分支编译，提前下载所有软件包
          make download -j8

      # 步骤八：多线程正式编译固件（利用服务器所有核心加速）
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Using $(nproc) threads for compilation."
          # 输出当前时间变量供后续打包使用
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          make -j$(nproc) V=s

      # 步骤九：打包编译好的固件并上传到网页端下载
      - name: Organize And Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-K2P-Master-${{ env.FILE_DATE }}
          path: openwrt/bin/targets/ralink/mt7621/
