name: K2P OpenWrt Build (Main Branch & Ccache)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (主分支建议填 master)'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：清理磁盘空间防止爆盘
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 步骤三：安装编译依赖
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            bc binutils-gold ccache ecj fastjar libbsd-dev libelf-dev liblzma-dev \
            liblzo2-dev libtool mtd-utils meson mold ninja-build pbzip2 pigz \
            pkg-config python3-dev subversion texinfo time u-boot-tools xsltproc xxd zstd
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 步骤四：配置 Ccache 缓存持久化（使用分支前缀提高命中率，限制 2GB）
      - name: Restore Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.event.inputs.branch }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 步骤五：克隆源码（浅克隆加速）
      - name: Clone Source Code
        run: |
          git clone --depth 1 --single-branch -b ${{ github.event.inputs.branch }} https://github.com/openwrt/openwrt.git openwrt

      # 步骤六：更新和安装 Feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤七：加载自定义配置与脚本（带安全容错）
      - name: Apply Configuration & Custom Scripts
        run: |
          if [ -f .config ]; then
            cp .config openwrt/.config
            echo "发现 .config 文件，已成功复制！"
          else
            echo "未发现 .config 文件，将使用 OpenWrt 默认配置。"
          fi

          if [ -f diy.sh ]; then
            chmod +x diy.sh
            ./diy.sh openwrt
            echo "diy.sh 执行完毕！"
          else
            echo "未发现 diy.sh 脚本，跳过自定义脚本处理。"
          fi

      # 步骤八：配置编译选项、初始化 Ccache 并多线程预下载依赖
      - name: Download Package Dependencies & Configure
        run: |
          cd openwrt
          make defconfig
          
          # 初始化 ccache 并锁死 2GB 限制
          export CCACHE_DIR=~/.ccache
          ccache -M 2G
          ccache -s
          
          # 开启全核并行预下载，把下载速度拉满
          make download -j$(nproc)

      # 步骤九：多线程正式编译固件（去除 V=s 提高磁盘 I/O 效率）
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Using $(nproc) threads for compilation."
          
          export CCACHE_DIR=~/.ccache
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          
          # 移除烦人的 V=s 详细刷屏，让 CPU 和磁盘全力冲刺编译
          make -j$(nproc)

      # 步骤十：排错调试 —— 打印 bin/targets 目录下的所有文件结构
      - name: Debug - List Generated Files
        run: |
          echo "========== 正在打印编译产物目录结构 =========="
          if [ -d "openwrt/bin/targets" ]; then
            find openwrt/bin/targets/ -type f -exec ls -lh {} +
          else
            echo "警告：openwrt/bin/targets 目录不存在，说明编译中途报错！"
          fi
          echo "=============================================="

      # 步骤十一：使用通配符打包上传所有固件
      - name: Organize And Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-K2P-Master-${{ env.FILE_DATE }}
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.img
            openwrt/bin/targets/**/config.buildinfo
            openwrt/bin/targets/**/profiles.json
