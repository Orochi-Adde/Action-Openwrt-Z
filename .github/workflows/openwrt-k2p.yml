name: K2P OpenWrt Build (Main Branch & Ccache)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (主分支建议填 master)'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：清理磁盘空间防止爆盘
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 步骤三：安装编译依赖
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            bc binutils-gold ccache ecj fastjar libbsd-dev libelf-dev liblzma-dev \
            liblzo2-dev libtool mtd-utils meson mold ninja-build pbzip2 pigz \
            pkg-config python3-dev subversion texinfo time u-boot-tools xsltproc xxd zstd
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 步骤四：配置 Ccache 缓存持久化（跨编译保留，严格限制在 2GB 以内防爆仓）
      - name: Restore Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 步骤五：克隆源码
      - name: Clone Source Code
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b ${{ github.event.inputs.branch }} openwrt

      # 步骤六：更新和安装 Feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤七：加载自定义配置与脚本（带安全容错）
      - name: Apply Configuration & Custom Scripts
        run: |
          if [ -f .config ]; then
            cp .config openwrt/.config
            echo "发现 .config 文件，已成功复制！"
          else
            echo "未发现 .config 文件，将使用 OpenWrt 默认配置。"
          fi

          if [ -f diy.sh ]; then
            chmod +x diy.sh
            ./diy.sh openwrt
            echo "diy.sh 执行完毕！"
          else
            echo "未发现 diy.sh 脚本，跳过自定义脚本处理。"
          fi

      # 步骤八：配置编译选项、初始化 Ccache 并下载依赖
      - name: Download Package Dependencies & Configure
        run: |
          cd openwrt
          make defconfig
          
          # 核心：初始化 ccache 并将最大体积锁死在 2GB，防止撑爆 GitHub 缓存配额
          export CCACHE_DIR=~/.ccache
          ccache -M 2G
          ccache -s
          
          make download -j8

      # 步骤九：多线程正式编译固件
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Using $(nproc) threads for compilation."
          
          # 确保编译时全局启用 ccache 环境变量
          export CCACHE_DIR=~/.ccache
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          make -j$(nproc) V=s

      # 步骤十：打包编译好的固件并上传（已修正为正确的 ramips 路径）
      - name: Organize And Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-K2P-Master-${{ env.FILE_DATE }}
          path: openwrt/bin/targets/ramips/mt7621/
