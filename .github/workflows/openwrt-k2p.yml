name: Custom OpenWrt Build for K2P

# 1. 触发方式：支持手动点击运行，也可以设置定时触发
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'master'
        # 选择编译分支 (例如 master 或 openwrt-23.05)
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-22.04 # 使用稳定高效的 Ubuntu 22.04 环境

    steps:
      # 步骤一：检出你自己的仓库代码（用来读取你可能写好的 diy 脚本）
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：给 GitHub 虚拟机清理出足够的硬盘空间（至关重要！防爆盘）
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 步骤三：安装编译 OpenWrt 所需的系统级依赖工具链
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-upx libfuse-dev ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev liblzo2-dev libncurses5-dev libltdl-dev libssl-dev libtool lrzsz mkisofs \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 步骤四：拉取官方（或未来改成 ImmortalWrt）源码
      - name: Clone Source Code
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b ${{ github.event.inputs.branch }} openwrt

      # 步骤五：更新和安装 Feeds 插件包
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤六：加载 K2P 的硬件配置文件与自定义脚本
      - name: Apply Configuration & Custom Scripts
        run: |
          # 如果你在仓库里放了自定义的配置文件，直接覆盖过去
          [ -f .config ] && cp .config openwrt/.config
          
          # 执行你自己的微调脚本（比如修改默认 IP 等）
          [ -f diy.sh ] && chmod +x diy.sh && ./diy.sh openwrt

      # 步骤七：生成默认配置并下载所有依赖源码（防编译中途断网）
      - name: Download Package Dependencies
        run: |
          cd openwrt
          make defconfig
          make download -j8

      # 步骤八：多线程正式编译固件（利用服务器所有核心加速）
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Using $(nproc) threads for compilation."
          make -j$(nproc) V=s
          # 生成当前时间变量并存入 GitHub 环境变量
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      # 步骤九：打包编译好的固件并上传到网页端下载
      - name: Organize And Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-K2P-Official-${{ env.FILE_DATE }}
          path: openwrt/bin/targets/ralink/mt7621/
