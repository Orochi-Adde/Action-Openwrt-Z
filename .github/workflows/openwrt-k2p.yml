name: K2P OpenWrt Build (Main Branch & Ccache)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (主分支建议填 master)'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：清理磁盘空间防止爆盘
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 步骤三：安装编译依赖
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            bc binutils-gold ccache ecj fastjar libbsd-dev libelf-dev liblzma-dev \
            liblzo2-dev libtool mtd-utils meson mold ninja-build pbzip2 pigz \
            pkg-config python3-dev subversion texinfo time u-boot-tools xsltproc xxd zstd
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 步骤四：配置 Ccache 缓存持久化
      - name: Restore Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.event.inputs.branch }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 步骤五：克隆源码
      - name: Clone Source Code
        run: |
          git clone --depth 1 --single-branch -b ${{ github.event.inputs.branch }} https://github.com/openwrt/openwrt.git openwrt

      # 步骤六：更新和安装 Feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤七：加载自定义配置与 K2P 强制指向
      - name: Apply Configuration & Set K2P Target
        run: |
          cd openwrt
          
          # 如果你根目录下上传了 .config，优先使用它
          if [ -f ../.config ]; then
            cp ../.config .config
            echo "发现仓库根目录的 .config 文件，已应用！"
          else
            echo "未发现 .config，正在自动写入 K2P (ramips/mt7621) 基础配置..."
            echo "CONFIG_TARGET_ramips=y" >> .config
            echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
            echo "CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y" >> .config
          fi

          if [ -f ../diy.sh ]; then
            chmod +x ../diy.sh
            ../diy.sh .
            echo "diy.sh 执行完毕！"
          fi

      # 步骤八：配置编译选项、初始化 Ccache 并多线程预下载
      - name: Download Package Dependencies & Configure
        run: |
          cd openwrt
          make defconfig
          
          export CCACHE_DIR=~/.ccache
          ccache -M 2G
          ccache -s
          
          make download -j$(nproc)

      # 步骤九：多线程正式编译固件
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Using $(nproc) threads for compilation."
          
          export CCACHE_DIR=~/.ccache
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          make -j$(nproc)

      # 步骤十：Debug 打印编译产物目录
      - name: Debug - List Generated Files
        run: |
          echo "========== 正在打印编译产物目录结构 =========="
          if [ -d "openwrt/bin/targets" ]; then
            find openwrt/bin/targets/ -type f -exec ls -lh {} +
          else
            echo "警告：openwrt/bin/targets 目录不存在！"
          fi
          echo "=============================================="

      # 步骤十一：打包上传 K2P 固件
      - name: Organize And Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-K2P-${{ env.FILE_DATE }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.img
            openwrt/bin/targets/ramips/mt7621/config.buildinfo
            openwrt/bin/targets/ramips/mt7621/profiles.json

