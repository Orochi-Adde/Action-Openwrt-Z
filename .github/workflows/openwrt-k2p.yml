name: K2P OpenWrt Build (Main Branch & Ccache)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (主分支建议填 master)'
        required: true
        default: 'master'
      build_mode:
        description: '选择编译模式 (fast=极速缓存编译, clean=全新全量清空编译)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - clean

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：清理磁盘空间防止爆盘
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 步骤三：安装编译依赖
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            bc binutils-gold ccache ecj fastjar libbsd-dev libelf-dev liblzma-dev \
            liblzo2-dev libtool mtd-utils meson mold ninja-build pbzip2 pigz \
            pkg-config python3-dev subversion texinfo time u-boot-tools xsltproc xxd zstd
          sudo timedatectl set-timezone "Asia/Shanghai"

      # 步骤四：克隆源码
      - name: Clone Source Code
        run: |
          git clone --depth 1 --single-branch -b ${{ github.event.inputs.branch }} https://github.com/openwrt/openwrt.git openwrt

      # 步骤五：动态缓存策略（如果是 clean 模式则直接跳过恢复，实现强行清空）
      - name: Restore Ccache & Toolchain Cache
        if: ${{ github.event.inputs.build_mode == 'fast' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: ${{ runner.os }}-openwrt-toolchain-${{ github.event.inputs.branch }}-${{ hashFiles('openwrt/include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-toolchain-${{ github.event.inputs.branch }}-
            ${{ runner.os }}-openwrt-toolchain-

      # 步骤六：更新和安装 Feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 步骤七：加载 K2P 目标配置并执行自定义 diy.sh 脚本
      - name: Apply Configuration & Run diy.sh
        run: |
          cd openwrt
          
          # 写入 K2P (ramips/mt7621) 基础配置
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y" >> .config

          # 执行根目录下的 diy.sh 脚本（自动注入 LuCI 和 Wi-Fi 开启逻辑）
          if [ -f ../diy.sh ]; then
            chmod +x ../diy.sh
            ../diy.sh
            echo "diy.sh 执行完毕！"
          fi

      # 步骤八：配置编译选项并预下载
      - name: Download Package Dependencies & Configure
        run: |
          cd openwrt
          make defconfig
          
          export CCACHE_DIR=~/.ccache
          ccache -M 2G
          ccache -s
          
          make download -j$(nproc)

      # 步骤九：多线程正式编译固件
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Using $(nproc) threads for compilation."
          
          export CCACHE_DIR=~/.ccache
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          make -j$(nproc)

      # 步骤十：打包上传 K2P 固件
      - name: Organize And Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-K2P-${{ env.FILE_DATE }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.img
            openwrt/bin/targets/ramips/mt7621/config.buildinfo
            openwrt/bin/targets/ramips/mt7621/profiles.json
